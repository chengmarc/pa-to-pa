[project]
name = "pa-to-pa"
version = "0.1.0"
description = "Agent-to-agent negotiation runs: persuader strategies against persona-conditioned persuadees"
requires-python = ">=3.11"

[project.scripts]
pa2pa-ui = "pa2pa.ui:main"
pa2pa-run = "pa2pa.run:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# src/ is the pa2pa package itself, flat
[tool.setuptools]
package-dir = {"pa2pa" = "src"}
packages = ["pa2pa"]
